version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: agromind_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: agromind_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: agromind_backend
    restart: always
    environment:
      - DATABASE_URL=mysql+pymysql://root:rootpassword@db:3306/agromind_db
      - USE_MYSQL=true
      - JWT_SECRET_KEY=agromind-jwt-secret-key-45678
      - SECRET_KEY=agromind-flask-secret-key-12345
      - HOST=0.0.0.0
      - PORT=5000
    ports:
      - "5000:5000"
    depends_on:
      - db
    volumes:
      - backend_uploads:/workspace/backend/uploads

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: agromind_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  backend_uploads:
