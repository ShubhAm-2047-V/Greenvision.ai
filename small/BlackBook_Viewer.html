<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroMind AI - Black Book</title>
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Mermaid.js for Diagrams -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <style>
        /* Warm White Website Theme */
        body {
            background-color: #faf8f5;
            color: #1f2937;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 40px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 60px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        h1, h2, h3, h4 {
            color: #10b981; /* Emerald Green */
            margin-top: 2em;
        }

        h1 {
            font-size: 2.5em;
            text-align: center;
            border-bottom: 2px solid #10b981;
            padding-bottom: 10px;
        }

        h2 {
            font-size: 1.8em;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        th, td {
            border: 1px solid #d1d5db;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #f3f4f6;
            color: #10b981;
        }

        .mermaid {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            display: flex;
            justify-content: center;
            border: 1px solid #e5e7eb;
        }

        hr {
            border: none;
            border-top: 2px dashed #d1d5db;
            margin: 40px 0;
        }

        @media print {
            body { background: white; padding: 0; }
            .container { box-shadow: none; padding: 0; }
            hr { page-break-after: always; }
        }
    </style>
</head>
<body>

    <div class="container" id="content"></div>

    <script>
        // Initialize Mermaid
        mermaid.initialize({ startOnLoad: false, theme: 'neutral' });

        // Load the markdown file
        // We use a local fetch assuming this is opened via a local server, 
        // OR you can paste the markdown directly below if local fetch blocks due to CORS.
        async function loadMarkdown() {
            try {
                // Pointing to the generated markdown artifact path
                const response = await fetch('file:///C:/Users/SHUBHAM/.gemini/antigravity-ide/brain/05890d92-be88-45e1-ab2d-932418e0d5e9/AgroMind_Black_Book.md');
                if(!response.ok) throw new Error("Need local server");
                const text = await response.text();
                render(text);
            } catch(e) {
                // Fallback instructions if opened directly from filesystem without a server
                document.getElementById('content').innerHTML = `
                    <h2 style="text-align:center; color:red;">Browser Security Blocked Local File Load</h2>
                    <p>To view this perfectly themed document, you have two options:</p>
                    <ol>
                        <li>Run a local server in your AgroMind AI folder (e.g., <code>npx serve .</code>) and open this HTML file via localhost.</li>
                        <li>Alternatively, open the <strong>AgroMind_Black_Book.md</strong> file in VS Code, right-click, and select "Markdown PDF: Export" to generate it.</li>
                    </ol>
                `;
            }
        }

        function render(markdownText) {
            // Parse Markdown
            document.getElementById('content').innerHTML = marked.parse(markdownText);
            
            // Render Mermaid diagrams
            const codeBlocks = document.querySelectorAll('code.language-mermaid');
            codeBlocks.forEach((block, index) => {
                const graphDefinition = block.textContent;
                const container = document.createElement('div');
                container.className = 'mermaid';
                container.textContent = graphDefinition;
                block.parentNode.parentNode.replaceChild(container, block.parentNode);
            });
            mermaid.run();
        }

        loadMarkdown();
    </script>
</body>
</html>
