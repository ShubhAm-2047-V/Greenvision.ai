<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://img.icons8.com/color/48/sprout.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgroMind AI - Smart Agriculture Crop Recommendation System</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- CDNs for React, Babel, Tailwind CSS and Lucide Icons -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
      body {
        font-family: 'Outfit', 'Inter', sans-serif;
      }
      .glass {
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.25);
      }
      .dark .glass {
        background: rgba(30, 41, 59, 0.75);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      @keyframes scan {
        0% { top: 0%; }
        50% { top: 100%; }
        100% { top: 0%; }
      }
      .scanline {
        position: absolute;
        left: 0;
        right: 0;
        height: 4px;
        background: #22C55E;
        box-shadow: 0 0 15px #22C55E;
        animation: scan 2.5s infinite linear;
      }
    </style>

    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: {
                light: '#4ADE80',
                DEFAULT: '#22C55E',
                dark: '#15803D',
              },
              secondary: {
                light: '#16A34A',
                DEFAULT: '#15803D',
                dark: '#166534',
              },
              accent: {
                light: '#A3E635',
                DEFAULT: '#84CC16',
                dark: '#65A30D',
              },
              darkbg: {
                DEFAULT: '#0F172A',
                card: '#1E293B',
                border: '#334155'
              }
            }
          }
        }
      }
    </script>
  </head>

        },

          brand: "एग्रोमाइंड AI",
          dashboard: "डॅशबोर्ड",
          predict: "पीक अंदाज",
          disease: "रोग स्कॅनर",
          chatbot: "AI चॅटबॉट",
          login: "लॉगिन",
          register: "नोंदणी",
          logout: "लॉगआउट",
          hero_title: "कृत्रिम बुद्धिमत्ता (AI) द्वारे स्मार्ट शेती",
          hero_subtitle: "योग्य पिकांचा अंदाज लावा, पानांवरील रोगांचे त्वरित निदान करा, सिंचन नियंत्रित करा आणि आमच्या मशीन लर्निंग प्लॅटफॉर्मसह पीक वाढवा."
        }
      };

      const App = () => {
        // App states
        const [currentPage, setCurrentPage] = useState('home');
        const [user, setUser] = useState(null);
        const [token, setToken] = useState(localStorage.getItem('av_token'));
        const [locale, setLocale] = useState(localStorage.getItem('av_locale') || 'en');
        const [darkMode, setDarkMode] = useState(localStorage.getItem('av_theme') === 'dark');
        const [langOpen, setLangOpen] = useState(false);

        // Fetch profile if token exists
        useEffect(() => {
          if (token) {
            fetch('/api/auth/profile', {
              headers: { 'Authorization': `Bearer ${token}` }
            })
            .then(res => {
              if (res.status === 200) return res.json();
              throw new Error();
            })
            .then(data => {
              setUser(data);
            })
            .catch(() => {
              localStorage.removeItem('av_token');
              setToken(null);
              setUser(null);
            });
          }
        }, [token]);

        // Theme Toggle
        useEffect(() => {
          const root = window.document.documentElement;
          if (darkMode) {
            root.classList.add('dark');
            root.classList.remove('light');
            localStorage.setItem('av_theme', 'dark');
          } else {
            root.classList.add('light');
            root.classList.remove('dark');
            localStorage.setItem('av_theme', 'light');
          }
        }, [darkMode]);

        const t = (key) => translations[locale][key] || translations['en'][key] || key;

        const logout = () => {
          localStorage.removeItem('av_token');
          setToken(null);
          setUser(null);
          setCurrentPage('home');
        };

        return (
          <div className="flex flex-col min-h-screen bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100">

            <nav className="sticky top-0 z-40 w-full glass border-b border-slate-200/50 dark:border-slate-800/50 px-4 py-3 sm:px-6 sm:py-4 flex items-center justify-between">

                <Icon name="sprout" className="w-7 h-7 sm:w-8 h-8 text-primary" />
                <span>{t('brand')}</span>
              </button>

              <div className="flex items-center gap-2 sm:gap-6">
                {user && (
                  <div className="hidden md:flex items-center gap-4">

          })
          .finally(() => setLoading(false));
        };

        useEffect(() => {
          if (user) {
            loadStats();
          }
        }, [user]);

        const downloadPDF = (id, crop) => {
          fetch(`/api/reports/download/${id}`, {
            headers: { 'Authorization': `Bearer ${token}` }
          })
          .then(res => res.blob())
          .then(blob => {
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Report_${crop}_${id}.pdf`;
            a.click();
          })
          .catch(() => alert("Error downloading report."));
        };

        const handleRetrain = async () => {
          setRetraining(true);
          setLogs('Running ML training pipeline...\nEvaluating RandomForest metrics...\nOptimizing feature weights...');
          try {
            const res = await fetch('/api/predictions/admin/retrain', {
              method: 'POST',
              headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            if (res.status === 200) {
              setMetrics({ accuracy: data.accuracy, best_model: data.best_model });
              setLogs(prev => prev + '\n\n' + data.logs + '\n\nPipeline complete.');
              loadStats();
            } else {
              setLogs(prev => prev + '\n\nExecution failed: ' + data.error);
            }
          } catch {
            setLogs(prev => prev + '\n\nConnection failed.');
          } finally {
            setRetraining(false);
          }
        };

        if (!user || loading) return <div className="flex flex-col items-center justify-center min-h-[50vh]"><Icon name="refresh-cw" className="w-10 h-10 animate-spin text-primary" /></div>;

        if (user.role === 'admin') {
          return (
            <div className="flex flex-col gap-8 text-left">
              <div>
                <h1 className="text-3xl font-extrabold tracking-tight">Admin Console</h1>
                <p className="text-xs text-slate-500">Monitor precision systems and trigger model retrain execution.</p>
              </div>

              {/* Stats Grid */}
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6">
                {[
                  { label: "Total Users", val: stats?.total_users || 0, icon: "users" },
                  { label: "Total Predictions", val: stats?.total_predictions || 0, icon: "activity" },
                  { label: "Active Farmers", val: stats?.active_farmers || 0, icon: "sprout" },
                  { label: "System Accuracy", val: `${((stats?.model_accuracy || 0.95)*100).toFixed(1)}%`, icon: "target" }
                ].map((s, i) => (
                  <div key={i} className="glass p-6 rounded-2xl flex items-center gap-4">
                    <div className="bg-primary/10 p-3 rounded-xl text-primary"><Icon name={s.icon} className="w-6 h-6" /></div>
                    <div>
                      <span className="text-[10px] uppercase font-semibold text-slate-400">{s.label}</span>
                      <h3 className="text-2xl font-bold mt-1">{s.val}</h3>
                    </div>
                  </div>
                ))}
              </div>

              {/* Retrain box */}
              <div className="glass p-6 rounded-2xl border border-slate-200/50 dark:border-slate-800/50">
                <h3 className="font-bold text-lg mb-4 flex items-center gap-2"><Icon name="database" className="w-5 h-5 text-primary" /> Model Training & Retraining Center</h3>
                <div className="flex flex-col md:flex-row gap-6">
                  <div className="md:w-1/3 flex flex-col justify-center items-center gap-4 p-6 bg-slate-100/50 dark:bg-slate-900/50 rounded-xl border border-slate-200/30">
                    <div className="text-center">
                      <span className="text-[10px] text-slate-400 font-semibold uppercase">ACTIVE CLASSIFIER</span>
                      <h4 className="font-bold text-primary text-lg">{stats?.best_model_name || 'Random Forest'}</h4>
                    </div>
                    <button onClick={handleRetrain} disabled={retraining} className="bg-primary hover:bg-primary-dark text-white font-bold py-3 px-6 rounded-xl border-0 cursor-pointer flex items-center gap-2 transition-all disabled:opacity-50">
                      <Icon name="refresh-cw" className={`w-4 h-4 ${retraining ? 'animate-spin' : ''}`} /> Retrain Pipeline
                    </button>
                    {metrics && (
                      <div className="p-3 bg-emerald-500/10 border border-emerald-500/20 text-emerald-600 rounded-lg text-xs font-semibold">Success: Validation {metrics.accuracy*100}%</div>
                    )}
                  </div>
                  <div className="md:w-2/3 bg-slate-950 text-emerald-400 p-4 rounded-xl font-mono text-[10px] min-h-[140px] max-h-48 overflow-y-auto">
                    <pre className="whitespace-pre-wrap">{logs || 'Terminal idle. Ready for pipeline optimization.'}</pre>
                  </div>
                </div>
              </div>
            </div>
          );
        }

        // Farmer Dashboard
        const popularCrops = Object.entries(stats?.crop_distribution || {}).sort((a,b) => b[1]-a[1]).slice(0, 4);
        const maxCropVal = popularCrops.length > 0 ? Math.max(...popularCrops.map(e => e[1])) : 1;
        const soilAvg = stats?.soil_averages || { nitrogen: 0, phosphorus: 0, potassium: 0, ph: 7 };

        return (
          <div className="flex flex-col gap-8 text-left">
            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
              <div>
                <h1 className="text-3xl font-extrabold tracking-tight">Farmer Workspace</h1>
                <p className="text-xs text-slate-500">Monitor soil nutrients, weather logs, and predicted crop guides.</p>
              </div>
              <div className="flex items-center gap-2">
                <button onClick={() => setPage('predict')} className="bg-primary hover:bg-primary-dark text-white font-bold px-5 py-3 rounded-xl shadow-lg border-0 cursor-pointer flex items-center gap-2 hover:scale-105 transition-all"><Icon name="plus" className="w-5 h-5" /> Run Predictor</button>
                <button onClick={() => setPage('disease')} className="border border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-800 font-semibold px-5 py-3 rounded-xl bg-transparent cursor-pointer flex items-center gap-2"><Icon name="camera" className="w-5 h-5 text-primary" /> Leaf Scan</button>
              </div>
            </div>

            {/* Farmer Stats Grid */}
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6">
              {[
                { label: "Total Predictions", val: stats?.total_predictions || 0, icon: "activity", color: "text-primary" },
                { label: "Crops Recommended", val: stats?.recommended_crops_count || 0, icon: "sprout", color: "text-accent" },
                { label: "Saved Reports", val: stats?.saved_reports || 0, icon: "file-text", color: "text-sky-500" },
                { label: "Model Accuracy", val: "95%", icon: "target", color: "text-emerald-500" }
              ].map((s, i) => (
                <div key={i} className="glass p-6 rounded-2xl flex items-center gap-4">
                  <div className={`bg-slate-100 dark:bg-slate-800 p-3 rounded-xl ${s.color}`}><Icon name={s.icon} className="w-6 h-6" /></div>
                  <div>
                    <span className="text-[10px] uppercase font-semibold text-slate-400">{s.label}</span>
                    <h3 className="text-2xl font-bold mt-1">{s.val}</h3>
                  </div>
                </div>
              ))}
            </div>

            {/* Farmer Charts */}
            <div className="grid lg:grid-cols-2 gap-8">
              {/* Soil */}
              <div className="glass p-6 rounded-2xl border border-slate-200/50 dark:border-slate-800/50">
                <h3 className="font-bold text-lg mb-6 flex items-center gap-2"><Icon name="activity" className="w-5 h-5 text-primary" /> Soil Nutrient Averages (mg/kg)</h3>
                <div className="flex flex-col gap-4">
                  {[['Nitrogen (N)', soilAvg.nitrogen, '#22C55E'], ['Phosphorus (P)', soilAvg.phosphorus, '#84CC16'], ['Potassium (K)', soilAvg.potassium, '#0EA5E9']].map(([lbl, val, col]) => (
                    <div key={lbl} className="flex flex-col gap-1">
                      <div className="flex justify-between text-xs font-semibold"><span>{lbl}</span><span>{val} mg/kg</span></div>
                      <div className="w-full bg-slate-100 dark:bg-slate-800 h-3 rounded-full overflow-hidden">
                        <div className="h-full rounded-full transition-all" style={{ width: `${Math.min(100, (val/180)*100)}%`, backgroundColor: col }}></div>
                      </div>
                    </div>
                  ))}
                  <div className="flex justify-between text-xs border-t border-slate-200/50 dark:border-slate-800/30 pt-3 mt-1 font-semibold">
                    <span>Average Soil pH</span>
                    <span className="text-primary font-bold">{soilAvg.ph}</span>
                  </div>
                </div>
              </div>

              {/* Crop Distribution */}
              <div className="glass p-6 rounded-2xl border border-slate-200/50 dark:border-slate-800/50">
                <h3 className="font-bold text-lg mb-6 flex items-center gap-2"><Icon name="trending-up" className="w-5 h-5 text-accent" /> Crop Recommendation Frequency</h3>
                {popularCrops.length === 0 ? (
                  <div className="flex flex-col items-center justify-center h-32 text-slate-400 text-xs">No records logged yet.</div>
                ) : (
                  <div className="flex flex-col gap-3.5">
                    {popularCrops.map(([crop, count]) => (
                      <div key={crop} className="flex items-center gap-4">
                        <span className="w-24 text-xs font-semibold truncate capitalize">{crop}</span>
                        <div className="flex-1 bg-slate-100 dark:bg-slate-800 h-5 rounded-lg overflow-hidden">
                          <div className="bg-primary h-full rounded-lg flex items-center justify-end px-2" style={{ width: `${(count/maxCropVal)*100}%` }}>
                            <span className="text-[9px] text-white font-bold">{count}</span>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>

            {/* History Table */}
            <div className="glass rounded-2xl border border-slate-200/50 dark:border-slate-800/50 overflow-hidden">
              <div className="p-6 border-b border-slate-200/30 dark:border-slate-800/30 flex justify-between items-center"><h3 className="font-bold text-lg">Crop Recommendation History</h3></div>
              {history.length === 0 ? (
                <div className="p-10 text-center text-xs text-slate-400">No predictions logged yet.</div>
              ) : (
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs">
                    <thead className="bg-slate-100/50 dark:bg-slate-900/50 border-b border-slate-200/30 dark:border-slate-800/30 font-semibold text-slate-400">
                      <tr>
                        <th className="px-6 py-4">Predicted Crop</th>
                        <th className="px-6 py-4">Confidence</th>
                        <th className="px-6 py-4">Soil N-P-K (pH)</th>
                        <th className="px-6 py-4">Climate (Temp/Rain)</th>
                        <th className="px-6 py-4">Date</th>
                        <th className="px-6 py-4 text-center">Report</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-200/30 dark:divide-slate-800/30">
                      {history.map(row => (
                        <tr key={row.id} className="hover:bg-slate-500/5">
                          <td className="px-6 py-4 font-bold text-primary">{row.crop}</td>
                          <td className="px-6 py-4"><span className="bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 px-2 py-0.5 rounded font-bold">{(row.confidence*100).toFixed(1)}%</span></td>
                          <td className="px-6 py-4">{row.nitrogen}-{row.phosphorus}-{row.potassium} ({row.ph})</td>
                          <td className="px-6 py-4">{row.temperature}°C / {row.rainfall}mm</td>
                          <td className="px-6 py-4 text-slate-400">{new Date(row.created_at).toLocaleDateString()}</td>
                          <td className="px-6 py-4 text-center">
                            <button onClick={() => downloadPDF(row.id, row.crop)} className="p-2 bg-primary/10 border border-primary/20 hover:bg-primary hover:text-white rounded-lg transition-all cursor-pointer"><Icon name="download" className="w-4 h-4" /></button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          </div>
        );
      };

      // 7. CROP PREDICTION PAGE
      const PredictPage = ({ token }) => {
        const [nitrogen, setNitrogen] = useState(80);
        const [phosphorus, setPhosphorus] = useState(45);
        const [potassium, setPotassium] = useState(40);
        const [ph, setPh] = useState(6.5);
        const [temperature, setTemperature] = useState(25.0);
        const [humidity, setHumidity] = useState(70.0);
        const [rainfall, setRainfall] = useState(120.0);
        const [state, setState] = useState('Maharashtra');
        const [district, setDistrict] = useState('Pune');
        const [season, setSeason] = useState('Kharif');

        const [loading, setLoading] = useState(false);
        const [weatherLoading, setWeatherLoading] = useState(false);
        const [result, setResult] = useState(null);
        const [error, setError] = useState('');

        const autoFillWeather = () => {
          setWeatherLoading(true);
          setError('');
          
          const fill = (lat, lon) => {
            fetch(`/api/utils/weather?lat=${lat}&lon=${lon}&state=${state}&district=${district}`)
              .then(res => res.json())
              .then(data => {
                setTemperature(data.current.temp);
                setHumidity(data.current.humidity);
                setRainfall(data.current.rainfall_monthly_avg);
                alert("Live weather coordinates parsed successfully.");
              })
              .catch(() => setError("Failed to fetch coordinates."))
              .finally(() => setWeatherLoading(false));
          };

          if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
              pos => fill(pos.coords.latitude, pos.coords.longitude),
              () => {
                fetch(`/api/utils/weather?state=${state}&district=${district}`)
                  .then(res => res.json())
                  .then(data => {
                    setTemperature(data.current.temp);
                    setHumidity(data.current.humidity);
                    setRainfall(data.current.rainfall_monthly_avg);
                    alert("Location denied. Prefilled simulated state weather values.");
                  })
                  .finally(() => setWeatherLoading(false));
              }
            );
          } else {
            setWeatherLoading(false);
          }
        };

        const handlePredict = async (e) => {
          e.preventDefault();
          setLoading(true);
          setError('');
          setResult(null);

          try {
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers['Authorization'] = `Bearer ${token}`;

            const res = await fetch('/api/predictions/predict', {
              method: 'POST',
              headers,
              body: JSON.stringify({
                nitrogen: floatVal(nitrogen),
                phosphorus: floatVal(phosphorus),
                potassium: floatVal(potassium),
                ph: floatVal(ph),
                temperature: floatVal(temperature),
                humidity: floatVal(humidity),
                rainfall: floatVal(rainfall),
                state,
                district,
                season
              })
            });
            const data = await res.json();
            if (res.status === 200) {
              setResult(data);
            } else {
              setError(data.message || 'Prediction failed.');
            }
          } catch {
            setError('Connection failure.');
          } finally {
            setLoading(false);
          }
        };

        const floatVal = (v) => parseFloat(v) || 0;

        const downloadPDF = () => {
          if (!result?.prediction_id) return;
          fetch(`/api/reports/download/${result.prediction_id}`, {
            headers: { 'Authorization': `Bearer ${token}` }
          })
          .then(res => res.blob())
          .then(blob => {
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Report_${result.crop}_${result.prediction_id}.pdf`;
            a.click();
          });
        };

        const featureImportance = result ? Object.entries(result.feature_importance).sort((a,b)=>b[1]-a[1]) : [];
        const maxImportanceVal = featureImportance.length > 0 ? Math.max(...featureImportance.map(e=>e[1])) : 1;

        return (
          <div className="flex flex-col gap-10 text-left">
            <div>
              <h1 className="text-3xl font-extrabold tracking-tight">Predict Crop</h1>
              <p className="text-xs text-slate-500">Provide soil analysis parameters and environmental weather fields to resolve crop suitability.</p>
            </div>

            <div className="flex flex-col lg:flex-row gap-8 items-start">
              {/* Form */}
              <div className="w-full lg:w-5/12 glass p-8 rounded-3xl border border-slate-200/50 dark:border-slate-800/50 shadow-xl">
                <div className="flex justify-between items-center border-b border-slate-200/30 pb-4 mb-6">
                  <h3 className="font-bold flex items-center gap-2"><Icon name="leaf" className="text-primary w-5 h-5" /> Chemistry parameters</h3>
                  <button type="button" onClick={autoFillWeather} disabled={weatherLoading} className="text-xs font-semibold text-primary border border-primary/20 hover:bg-primary/5 px-3 py-2 rounded-lg cursor-pointer bg-transparent flex items-center gap-1.5 disabled:opacity-50">
                    <Icon name="cloud-sun" className="w-3.5 h-3.5" /> Auto-fill Weather
                  </button>
                </div>

                {error && <div className="p-3 bg-rose-500/10 text-rose-500 rounded-lg text-xs mb-4">{error}</div>}

                 <form onSubmit={handlePredict} className="flex flex-col gap-4">
                  {/* Soil Type Presets Helper */}
                  <div className="flex flex-col gap-1 p-3.5 bg-primary/5 border border-primary/20 rounded-2xl mb-2 text-xs">
                    <label className="font-bold text-slate-700 dark:text-slate-300 flex items-center gap-1.5">
                      <Icon name="sprout" className="w-4 h-4 text-primary" />
                      Nutrient Presets (Don't have a soil lab report?)
                    </label>
                    <select 
                      onChange={(e) => {
                        const val = e.target.value;
                        if (val === 'black') {
                          setNitrogen(55); setPhosphorus(35); setPotassium(220); setPh(7.2);
                        } else if (val === 'red') {
                          setNitrogen(45); setPhosphorus(25); setPotassium(140); setPh(6.0);
                        } else if (val === 'sandy') {
                          setNitrogen(30); setPhosphorus(20); setPotassium(95); setPh(6.2);
                        } else if (val === 'clayey') {
                          setNitrogen(70); setPhosphorus(45); setPotassium(190); setPh(7.5);
                        } else if (val === 'loamy') {
                          setNitrogen(85); setPhosphorus(50); setPotassium(180); setPh(6.8);
                        }
                      }} 
                      className="px-3 py-2 mt-1 rounded-lg border border-slate-200 dark:border-slate-800 bg-transparent text-xs dark:bg-slate-900 cursor-pointer focus:outline-none focus:border-primary"
                    >
                      <option value="">-- Select Typical Soil Type Preset --</option>
                      <option value="loamy">Loamy / Alluvial Soil (Balanced, pH 6.8)</option>
                      <option value="black">Black Soil (High Potassium, pH 7.2)</option>
                      <option value="red">Red/Laterite Soil (Low nutrients, Acidic pH 6.0)</option>
                      <option value="sandy">Sandy Soil (Very low nutrients, pH 6.2)</option>
                      <option value="clayey">Clayey Soil (High retention, pH 7.5)</option>
                    </select>
                    <p className="text-[10px] text-slate-400 leading-normal mt-1.5">
                      💡 Farmers can fetch these from their official government <b>Soil Health Card</b> or local agricultural lab test. If you don't have it, select a preset above.
                    </p>
                  </div>

                  <span className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Soil Nutrients</span>
                  <div className="grid grid-cols-2 gap-4">
                    <div className="flex flex-col gap-1">
                      <label className="text-xs font-semibold text-slate-500">Nitrogen (N)</label>
                      <input required type="number" step="any" value={nitrogen} onChange={e=>setNitrogen(e.target.value)} className="px-4 py-2 rounded-lg border border-slate-200 dark:border-slate-800 bg-transparent text-xs focus:border-primary focus:outline-none" />
                    </div>
                    <div className="flex flex-col gap-1">
                      <label className="text-xs font-semibold text-slate-500">Phosphorus (P)</label>
                      <input required type="number" step="any" value={phosphorus} onChange={e=>setPhosphorus(e.target.value)} className="px-4 py-2 rounded-lg border border-slate-200 dark:border-slate-800 bg-transparent text-xs focus:border-primary focus:outline-none" />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-4">
                    <div className="flex flex-col gap-1">
                      <label className="text-xs font-semibold text-slate-500">Potassium (K)</label>
                      <input required type="number" step="any" value={potassium} onChange={e=>setPotassium(e.target.value)} className="px-4 py-2 rounded-lg border border-slate-200 dark:border-slate-800 bg-transparent text-xs focus:border-primary focus:outline-none" />
                    </div>
                    <div className="flex flex-col gap-1">
                      <label className="text-xs font-semibold text-slate-500">Soil pH</label>
                      <input required type="number" step="0.1" value={ph} onChange={e=>setPh(e.target.value)} className="px-4 py-2 rounded-lg border border-slate-200 dark:border-slate-800 bg-transparent text-xs focus:border-primary focus:outline-none" />
                    </div>
                  </div>

                  <span className="text-[10px] text-slate-400 font-bold uppercase tracking-wider mt-2">Climate & Geographics</span>
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div className="flex flex-col gap-1">
                      <label className="text-[10px] font-semibold text-slate-500">Temp (°C)</label>
                      <input required type="number" step="any" value={temperature} onChange={e=>setTemperature(e.target.value)} className="px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-800 bg-transparent text-xs" />
                    </div>
                    <div className="flex flex-col gap-1">
                      <label className="text-[10px] font-semibold text-slate-500">Humidity (%)</label>
                      <input required type="number" step="any" value={humidity} onChange={e=>setHumidity(e.target.value)} className="px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-800 bg-transparent text-xs" />
                    </div>
                    <div className="flex flex-col gap-1">
                      <label className="text-[10px] font-semibold text-slate-500">Rainfall (mm)</label>
                      <input required type="number" step="any" value={rainfall} onChange={e=>setRainfall(e.target.value)} className="px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-800 bg-transparent text-xs" />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-4">
                    <div className="flex flex-col gap-1">
                      <label className="text-xs font-semibold text-slate-500">State</label>
                      <input type="text" value={state} onChange={e=>setState(e.target.value)} className="px-4 py-2 rounded-lg border border-slate-200 dark:border-slate-800 bg-transparent text-xs" />
                    </div>
                    <div className="flex flex-col gap-1">
                      <label className="text-xs font-semibold text-slate-500">District</label>
                      <input type="text" value={district} onChange={e=>setDistrict(e.target.value)} className="px-4 py-2 rounded-lg border border-slate-200 dark:border-slate-800 bg-transparent text-xs" />
                    </div>
                  </div>
                  <button type="submit" disabled={loading} className="bg-primary hover:bg-primary-dark text-white font-bold py-3.5 rounded-lg border-0 cursor-pointer mt-2 flex items-center justify-center gap-2">
                    {loading && <Icon name="refresh-cw" className="w-5 h-5 animate-spin" />} Predict Suitability
                  </button>
                </form>
              </div>

              {/* Result View */}
              <div className="w-full lg:w-7/12">
                {result ? (
                  <div className="flex flex-col gap-6">
                    {/* Header card */}
                    <div className="glass p-8 rounded-3xl border border-primary/30 relative">
                      <span className="text-[10px] text-slate-400 uppercase tracking-widest font-semibold block">RECOMMENDED CROP</span>
                      <h2 className="text-4xl font-extrabold text-primary-dark dark:text-primary-light flex items-center gap-2 mt-2"><Icon name="leaf" className="w-8 h-8 text-primary" /> {result.crop}</h2>
                      <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 mt-6 py-4 border-y border-slate-200/50 dark:border-slate-800/30 text-xs">
                        <div><span className="text-slate-400 block">Confidence</span><span className="font-bold text-primary">{(result.confidence*100).toFixed(1)}%</span></div>
                        <div><span className="text-slate-400 block">Season</span><span className="font-bold">{result.season}</span></div>
                        <div><span className="text-slate-400 block">Yield Est.</span><span className="font-bold">{result.expected_yield}</span></div>
                        <div><span className="text-slate-400 block">Market Profit</span><span className="font-bold text-emerald-600 dark:text-emerald-400">{result.estimated_profit}</span></div>
                      </div>
                      <p className="text-xs text-slate-500 leading-relaxed mt-4">{result.explanation}</p>
                      
                      {result.prediction_id && (
                        <button onClick={downloadPDF} className="bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 px-6 rounded-xl border-0 cursor-pointer mt-4 flex items-center gap-2"><Icon name="download" className="w-4 h-4" /> Download PDF Analysis</button>
                      )}
                    </div>

                    {/* XAI Importance */}
                    <div className="glass p-6 rounded-3xl border border-slate-200/50 dark:border-slate-800/50">
                      <h3 className="font-bold text-sm mb-4 flex items-center gap-2"><Icon name="trending-up" className="w-5 h-5 text-accent" /> Explainable AI (XAI) - Feature Contributions</h3>
                      <div className="flex flex-col gap-3">
                        {featureImportance.map(([feat, val]) => (
                          <div key={feat} className="flex items-center gap-4">
                            <span className="w-24 text-xs font-semibold capitalize truncate">{feat}</span>
                            <div className="flex-1 bg-slate-100 dark:bg-slate-800 h-4 rounded-lg overflow-hidden">
                              <div className="bg-primary h-full rounded-lg flex items-center justify-end px-2" style={{ width: `${(val/maxImportanceVal)*100}%` }}><span className="text-[8px] text-white font-bold">{(val*100).toFixed(1)}%</span></div>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>

                    {/* Fertilizers */}
                    <div className="glass p-6 rounded-3xl border border-slate-200/50 dark:border-slate-800/50 text-xs">
                      <h3 className="font-bold text-sm mb-4 flex items-center gap-2"><Icon name="leaf" className="w-4 h-4 text-primary" /> Fertilizer dosage targets</h3>
                      <table className="w-full text-left">
                        <thead className="bg-slate-100/50 dark:bg-slate-900/50 border-b border-slate-200/30">
                          <tr><th className="p-3">Name</th><th className="p-3">Quantity</th><th className="p-3">Schedule</th><th className="p-3 text-right">Cost</th></tr>
                        </thead>
                        <tbody>
                          {result.fertilizer_recommendation.fertilizers.map((f, i) => (
                            <tr key={i} className="hover:bg-slate-500/5">
                              <td className="p-3 font-semibold text-primary">{f.name}</td>
                              <td className="p-3 font-bold">{f.quantity}</td>
                              <td className="p-3">{f.schedule}</td>
                              <td className="p-3 text-right font-bold text-emerald-600">{f.estimated_cost}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                      <div className="bg-primary/10 p-3 rounded-lg border border-primary/20 mt-3 font-semibold">pH Advice: {result.fertilizer_recommendation.ph_advice}</div>
                    </div>

                    {/* Irrigation */}
                    <div className="glass p-6 rounded-3xl border border-slate-200/50 dark:border-slate-800/50 text-xs">
                      <h3 className="font-bold text-sm mb-4 flex items-center gap-2"><Icon name="droplet" className="w-4 h-4 text-sky-500" /> Smart Irrigation targets</h3>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4 text-center">
                        <div className="p-3 bg-slate-100/50 dark:bg-slate-900/50 rounded-xl">
                          <span className="text-[10px] text-slate-400 font-semibold block">DAILY WATER TARGET</span>
                          <span className="text-xl font-bold text-sky-500">{result.irrigation_recommendation.daily_water_requirement_liters} Liters</span>
                        </div>
                        <div className="p-3 bg-slate-100/50 dark:bg-slate-900/50 rounded-xl">
                          <span className="text-[10px] text-slate-400 font-semibold block">FREQUENCY</span>
                          <span className="text-xs font-bold">{result.irrigation_recommendation.irrigation_frequency}</span>
                        </div>
                      </div>
                    </div>
                  </div>
                ) : (
                  <div className="glass p-12 rounded-3xl border border-slate-200/50 dark:border-slate-800/50 text-slate-400 flex flex-col items-center justify-center text-center min-h-[40vh]">
                    <Icon name="leaf" className="w-12 h-12 text-primary/30 mb-4 animate-bounce" />
                    <h3 className="font-bold text-slate-700 dark:text-slate-300">Awaiting soil parameters</h3>
                    <p className="text-xs max-w-xs mt-1">Provide metrics on the left panel to execute target prediction matching.</p>
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      };

      // 8. LEAF DISEASE SCANNER PAGE
      const DiseasePage = ({ token }) => {
        const [cropType, setCropType] = useState('tomato');
        const [selectedFile, setSelectedFile] = useState(null);
        const [preview, setPreview] = useState('');
        const [scanning, setScanning] = useState(false);
        const [result, setResult] = useState(null);
        const [error, setError] = useState('');

        const handleFileChange = (e) => {
          const file = e.target.files[0];
          if (file) {
            setSelectedFile(file);
            setPreview(URL.createObjectURL(file));
            setResult(null);
            setError('');
          }
        };

        const handleScan = async (e) => {
          e.preventDefault();
          if (!selectedFile) {
            setError("Select a photo leaf uploader first.");
            return;
          }
          setError('');
          setScanning(true);
          setResult(null);

          const formData = new FormData();
          formData.append('image', selectedFile);
          formData.append('crop_type', cropType);

          setTimeout(async () => {
            try {
              const headers = {};
              if (token) headers['Authorization'] = `Bearer ${token}`;

              const res = await fetch('/api/disease/detect', {
                method: 'POST',
                headers,
                body: formData
              });
              const data = await res.json();
              if (res.status === 200) {
                setResult(data);
              } else {
                setError(data.message || 'Scan failed.');
              }
            } catch {
              setError('Connection failure.');
            } finally {
              setScanning(false);
            }
          }, 2500);
        };

        return (
          <div className="flex flex-col gap-10 text-left">
            <div>
              <h1 className="text-3xl font-extrabold tracking-tight">Disease Scanner</h1>
              <p className="text-xs text-slate-500">Upload a clear photo of the infected crop leaf to identify agricultural diseases and treatment remedies.</p>
            </div>

            <div className="flex flex-col lg:flex-row gap-8 items-start">
              {/* Form Upload */}
              <div className="w-full lg:w-5/12 glass p-8 rounded-3xl border border-slate-200/50 dark:border-slate-800/50 shadow-xl">
                <h3 className="font-bold flex items-center gap-2 mb-6 border-b border-slate-200/30 pb-4"><Icon name="camera" className="text-primary w-5 h-5" /> Image upload</h3>
                
                {error && <div className="p-3 bg-rose-500/10 text-rose-500 rounded-lg text-xs mb-4">{error}</div>}

                <form onSubmit={handleScan} className="flex flex-col gap-4">
                  <div className="flex flex-col gap-1">
                    <label className="text-xs font-semibold text-slate-500">Crop Category</label>
                    <select value={cropType} onChange={e=>setCropType(e.target.value)} className="px-4 py-2.5 rounded-lg border border-slate-200 dark:border-slate-800 bg-transparent text-xs dark:bg-slate-900">
                      <option value="tomato">Tomato</option>
                      <option value="potato">Potato</option>
                      <option value="rice">Rice</option>
                      <option value="wheat">Wheat</option>
                      <option value="corn">Corn</option>
                    </select>
                  </div>

                  <div className="border-2 border-dashed border-slate-200 dark:border-slate-800 hover:border-primary/50 rounded-2xl p-6 relative flex flex-col items-center justify-center min-h-[220px] cursor-pointer">
                    <input type="file" accept="image/*" onChange={handleFileChange} className="absolute inset-0 opacity-0 cursor-pointer z-10" />
                    {preview ? (
                      <div className="relative max-h-52 w-full flex items-center justify-center overflow-hidden rounded-xl">
                        <img src={preview} alt="leaf" className="max-h-48 object-contain" />
                        {scanning && <div className="scanline"></div>}
                      </div>
                    ) : (
                      <div className="flex flex-col items-center gap-2 text-slate-400">
                        <Icon name="upload" className="w-10 h-10 stroke-1" />
                        <span className="text-xs font-semibold">Select leaf photograph</span>
                      </div>
                    )}
                  </div>

                  <button type="submit" disabled={scanning || !selectedFile} className="bg-primary hover:bg-primary-dark text-white font-bold py-3.5 rounded-lg border-0 cursor-pointer mt-2 flex items-center justify-center gap-2 disabled:opacity-50">
                    <Icon name="sparkles" className="w-5 h-5" /> Run Diagnosis
                  </button>
                </form>
              </div>

              {/* Scan result display */}
              <div className="w-full lg:w-7/12">
                {result ? (
                  <div className="glass p-8 rounded-3xl border border-emerald-500/25 shadow-2xl flex flex-col gap-4">
                    <span className="bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 px-3 py-1 rounded-full text-[10px] uppercase font-bold self-start">Diagnosis completed</span>
                    <div className="mt-2">
                      <span className="text-[10px] text-slate-400 uppercase tracking-widest block">IDENTIFIED PATHOLOGY</span>
                      <h3 className="text-2xl font-bold flex items-center gap-2 mt-1"><Icon name="shield-check" className="text-primary w-6 h-6" /> {result.disease_name}</h3>
                      <span className="text-[10px] text-slate-400 mt-1 block">Confidence: <b>{(result.confidence*100).toFixed(1)}%</b></span>
                    </div>
                    <div className="grid md:grid-cols-2 gap-6 mt-4 pt-4 border-t border-slate-200/30 text-xs">
                      <div><h4 className="font-bold mb-2 text-slate-700 dark:text-slate-300">Symptoms</h4><p className="text-slate-400 leading-relaxed">{result.symptoms}</p></div>
                      <div><h4 className="font-bold mb-2 text-slate-700 dark:text-slate-300">Remedies</h4><p className="text-slate-400 leading-relaxed">{result.treatment}</p></div>
                    </div>
                    <div className="bg-primary/10 border border-primary/20 p-3 rounded-xl text-xs mt-3"><h4 className="font-bold text-primary-dark mb-1">Prevention</h4><p className="text-slate-700 dark:text-slate-300">{result.prevention}</p></div>
                  </div>
                ) : (
                  <div className="glass p-12 rounded-3xl border border-slate-200/50 dark:border-slate-800/50 text-slate-400 flex flex-col items-center justify-center text-center min-h-[40vh]">
                    <Icon name="upload" className="w-12 h-12 text-primary/30 mb-4" />
                    <h3 className="font-bold text-slate-700 dark:text-slate-300">Diagnostic scan panel</h3>
                    <p className="text-xs max-w-xs mt-1">Upload a leaf photo on the left panel to execute crop pathology diagnostics.</p>
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      };

      // 9. CHATBOT FLOATING WIDGET
      const ChatbotWidget = () => {
        const [open, setOpen] = useState(false);
        const [messages, setMessages] = useState([
          { sender: 'bot', text: 'Hi! Ask me about NPK soil targets, drip irrigation, or leaf blight diagnosis.' }
        ]);
        const [input, setInput] = useState('');
        const [loading, setLoading] = useState(false);
        const endRef = useRef(null);

        const handleSend = async (textVal) => {
          const text = textVal || input;
          if (!text.trim()) return;
          setMessages(prev => [...prev, { sender: 'user', text }]);
          setInput('');
          setLoading(true);

          try {
            const res = await fetch('/api/chatbot/message', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ message: text })
            });
            const data = await res.json();
            setMessages(prev => [...prev, { sender: 'bot', text: data.response }]);
          } catch {
            setMessages(prev => [...prev, { sender: 'bot', text: 'Sorry, failed to connect to chat agent.' }]);
          } finally {
            setLoading(false);
          }
        };

        useEffect(() => {
          endRef.current?.scrollIntoView({ behavior: 'smooth' });
        }, [messages, open]);

        return (
          <div className="fixed bottom-20 right-4 sm:bottom-6 sm:right-6 z-50">
            {!open && (
              <button onClick={() => setOpen(true)} className="bg-primary hover:bg-primary-dark text-white p-4 rounded-full shadow-2xl border-0 cursor-pointer flex items-center justify-center"><Icon name="message-square" className="w-6 h-6 animate-pulse" /></button>
            )}
            {open && (
              <div className="glass w-[calc(100vw-2rem)] sm:w-[340px] h-[380px] sm:h-[450px] rounded-3xl border border-slate-200/50 dark:border-slate-800/50 shadow-2xl flex flex-col overflow-hidden text-left animate-fade-in bg-white dark:bg-slate-900">
                <div className="bg-primary text-white p-4 flex justify-between items-center">
                  <div className="flex items-center gap-2"><Icon name="bot" className="w-5 h-5" /><h4 className="font-bold text-sm">AgroMind Assistant</h4></div>
                  <button onClick={() => setOpen(false)} className="p-1 hover:bg-white/10 rounded-full transition-colors bg-transparent border-0 cursor-pointer text-white"><Icon name="x" className="w-4 h-4" /></button>
                </div>
                <div className="flex-1 overflow-y-auto p-4 flex flex-col gap-3">
                  {messages.map((m, i) => (
                    <div key={i} className={`flex gap-2 max-w-[85%] ${m.sender === 'user' ? 'self-end flex-row-reverse' : 'self-start'}`}>
                      <div className={`w-6 h-6 rounded-full flex items-center justify-center flex-shrink-0 text-white text-[10px] ${m.sender === 'user' ? 'bg-indigo-600' : 'bg-primary'}`}>{m.sender === 'user' ? 'U' : 'B'}</div>
                      <div className={`p-2.5 rounded-2xl text-[11px] leading-relaxed whitespace-pre-line ${m.sender === 'user' ? 'bg-indigo-600 text-white rounded-tr-none' : 'bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-100 rounded-tl-none border border-slate-200 dark:border-slate-800'}`}>{m.text}</div>
                    </div>
                  ))}
                  {loading && <div className="text-slate-400 text-[10px] flex items-center gap-1.5"><Icon name="refresh-cw" className="w-3.5 h-3.5 animate-spin text-primary" /> Thinking...</div>}
                  <div ref={endRef} />
                </div>
                <div className="p-3 border-t border-slate-200/50 dark:border-slate-800/30 flex items-center gap-2">
                  <input type="text" value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleSend()} placeholder="Ask farming questions..." className="flex-1 bg-slate-100 dark:bg-slate-800 px-4 py-2 rounded-xl text-xs focus:outline-none border-0" />
                  <button onClick={() => handleSend()} className="bg-primary hover:bg-primary-dark text-white p-2.5 rounded-xl border-0 cursor-pointer"><Icon name="send" className="w-3.5 h-3.5" /></button>
                </div>
              </div>
            )}
          </div>
        );
      };

      // Mount App
      const container = document.getElementById('root');
      const root = ReactDOM.createRoot(container);
      root.render(<App />);
    </script>
    {% endraw %}
  </body>
</html>
